name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - mushroom
      - Login

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-7f3b9a2d5e8c4f1a6b0d9e2c5a8f3b7d1e4c6a9f0b2d5e8f1a4c7b0d3e6f9a2c
      NEXT_TELEMETRY_DISABLED: "1"
      VULCAN_VARIANT: mushroom

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: |
          npm ci
          uv sync --frozen

      - name: Check frontend types
        run: npm run typecheck

      - name: Lint frontend
        run: npm run lint

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=moderate

      - name: Build mushroom frontend
        run: npm run build
        env:
          NEXT_DIST_DIR: .next-build

      - name: Build automotive frontend
        run: npm run build
        env:
          NEXT_DIST_DIR: .next-build
          VULCAN_VARIANT: automotive

      - name: Lint Python
        run: uv run ruff check .

      - name: Audit Python dependencies
        run: uv run pip-audit --strict

      - name: Run Python tests
        run: uv run pytest

      - name: Reject missing migrations
        run: uv run python backend/manage.py makemigrations --check --dry-run

      - name: Run Django deployment checks
        run: uv run python backend/manage.py check --deploy --fail-level WARNING
        env:
          CORS_ALLOWED_ORIGINS: ""
          DJANGO_ALLOWED_HOSTS: app.example.test
          DJANGO_CACHE_URL: redis://127.0.0.1:6379/1
          DJANGO_CSRF_TRUSTED_ORIGINS: https://app.example.test
          DJANGO_DATABASE_URL: postgresql://vulcan:ci-only@127.0.0.1:5432/vulcan
          DJANGO_DEBUG: "false"
          REDIS_URL: redis://127.0.0.1:6379/0
