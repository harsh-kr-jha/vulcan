name: Deploy GCE variant showcase
run-name: ${{ inputs.variant }} · ${{ github.ref_name }} · ${{ github.sha }} · ${{ inputs.reason }}

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Which isolated product variant should this target run?
        required: true
        type: choice
        options:
          - automotive
          - mushroom
      reason:
        description: Why is this deployment being made?
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-gce-${{ inputs.variant }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: gentle-broker-505219-d0
  GCP_REGION: us-central1
  AR_REPOSITORY: vulcan

jobs:
  build:
    name: Build ${{ inputs.variant }} ${{ matrix.name }} image
    runs-on: ubuntu-latest
    environment: gcp-${{ inputs.variant }}-showcase
    strategy:
      fail-fast: true
      matrix:
        name: [backend, frontend]
    steps:
      - name: Check out the selected branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Confirm the deployment identity
        run: |
          echo "Variant: ${{ inputs.variant }}"
          echo "Branch or tag: $GITHUB_REF_NAME"
          echo "Immutable commit: $GITHUB_SHA"
          echo "Reason: ${{ inputs.reason }}"

      - name: Authenticate to Google Cloud without a stored key
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish immutable variant image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.name }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ matrix.name }}-${{ inputs.variant }}:${{ github.sha }}
          build-args: |
            VULCAN_VARIANT=${{ inputs.variant }}
          cache-from: type=gha,scope=gce-${{ inputs.variant }}-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=gce-${{ inputs.variant }}-${{ matrix.name }}

  deploy:
    name: Back up, migrate, and deploy exact image tag
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: gcp-${{ inputs.variant }}-showcase
      url: ${{ vars.APP_URL }}
    steps:
      - name: Check out deployment files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud without a stored key
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Install reviewed deployment files
        env:
          GCE_INSTANCE: ${{ vars.GCE_INSTANCE }}
          GCE_ZONE: ${{ vars.GCE_ZONE }}
          VARIANT: ${{ inputs.variant }}
        run: |
          case "$VARIANT" in automotive|mushroom) ;; *) exit 2 ;; esac
          gcloud compute ssh "$GCE_INSTANCE" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCE_ZONE" \
            --tunnel-through-iap \
            --command 'install -d -m 0755 /tmp/vulcan-deploy'
          gcloud compute scp \
            deploy/gce-micro/compose.yaml \
            deploy/gce-micro/Caddyfile \
            deploy/gce-micro/backup.sh \
            deploy/gce-micro/deploy.sh \
            deploy/gce-micro/vulcan-backup.service \
            deploy/gce-micro/vulcan-backup.timer \
            "$GCE_INSTANCE:/tmp/vulcan-deploy/" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCE_ZONE" \
            --tunnel-through-iap
          gcloud compute ssh "$GCE_INSTANCE" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCE_ZONE" \
            --tunnel-through-iap \
            --command "sudo install -d -m 0755 /opt/vulcan /var/lib/vulcan/$VARIANT/data /var/lib/vulcan/$VARIANT/backups /var/lib/vulcan/$VARIANT/static && sudo install -m 0644 /tmp/vulcan-deploy/compose.yaml /opt/vulcan/compose.yaml && sudo install -m 0644 /tmp/vulcan-deploy/Caddyfile /opt/vulcan/Caddyfile && sudo install -m 0755 /tmp/vulcan-deploy/backup.sh /opt/vulcan/backup.sh && sudo install -m 0755 /tmp/vulcan-deploy/deploy.sh /opt/vulcan/deploy.sh && sudo install -m 0644 /tmp/vulcan-deploy/vulcan-backup.service /etc/systemd/system/vulcan-backup.service && sudo install -m 0644 /tmp/vulcan-deploy/vulcan-backup.timer /etc/systemd/system/vulcan-backup.timer && sudo systemctl daemon-reload && sudo systemctl enable --now vulcan-backup.timer"

      - name: Create pre-deploy backup and deploy
        env:
          GCE_INSTANCE: ${{ vars.GCE_INSTANCE }}
          GCE_ZONE: ${{ vars.GCE_ZONE }}
        run: |
          gcloud compute ssh "$GCE_INSTANCE" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCE_ZONE" \
            --tunnel-through-iap \
            --command "sudo /opt/vulcan/deploy.sh '${{ inputs.variant }}' '${{ github.sha }}'"

      - name: Verify the public application
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          curl --fail --show-error --silent --retry 12 --retry-all-errors \
            --retry-delay 10 "$APP_URL/api/backend/health/"
