# Local development only. Do not reuse these credentials or expose these
# services in a production deployment.
name: vulcan

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vulcan
      POSTGRES_USER: vulcan
      POSTGRES_PASSWORD: vulcan
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulcan"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vulcan
      MINIO_ROOT_PASSWORD: vulcan-local-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  create-bucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 vulcan vulcan-local-secret; do sleep 1; done
        mc mb --ignore-existing local/vulcan-factory-data
        mc anonymous set private local/vulcan-factory-data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      DJANGO_DATABASE_URL: postgresql://vulcan:vulcan@postgres:5432/vulcan
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    command: >
      sh -c "python backend/manage.py migrate &&
             python backend/manage.py seed_mushroom &&
             gunicorn --chdir backend --bind 0.0.0.0:8000 --workers 3 config.wsgi:application"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      DJANGO_DATABASE_URL: postgresql://vulcan:vulcan@postgres:5432/vulcan
    depends_on:
      backend:
        condition: service_started
    command: celery -A config worker -l INFO -Q file_inspection,validation,standardisation,analytics,reports
    working_dir: /app/backend

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_URL: http://backend:8000
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
  minio-data:
