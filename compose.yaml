# Local development only. Do not reuse these credentials or expose these
# services in a production deployment.
name: vulcan

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    environment:
      CLICKHOUSE_DB: vulcan
      CLICKHOUSE_USER: vulcan_ingest
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-vulcan-local-secret}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9009:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --user=vulcan_ingest --password=$${CLICKHOUSE_PASSWORD} http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vulcan
      POSTGRES_USER: vulcan
      POSTGRES_PASSWORD: vulcan
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulcan"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-backup:
    image: postgres:17-alpine
    profiles: ["tools"]
    environment:
      PGPASSWORD: vulcan
    volumes:
      - ./.data/backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        pg_dump --host postgres --username vulcan --dbname vulcan --format custom
        --file "/backups/vulcan-$$(date -u +%Y%m%dT%H%M%SZ).dump"

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vulcan
      MINIO_ROOT_PASSWORD: vulcan-local-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  create-bucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 vulcan vulcan-local-secret; do sleep 1; done
        mc mb --ignore-existing local/vulcan-factory-data
        mc anonymous set private local/vulcan-factory-data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      DJANGO_DATABASE_URL: postgresql://vulcan:vulcan@postgres:5432/vulcan
      ML_MODEL_DIR: /app/models
      TELEMETRY_STORAGE_BACKEND: filesystem
      TELEMETRY_STORAGE_ROOT: /app/.data/telemetry
    volumes:
      - ./models:/app/models:ro
      - ./.data:/app/.data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    command: >
      sh -c "python backend/manage.py migrate &&
             python backend/manage.py seed_mushroom &&
             gunicorn --chdir backend --bind 0.0.0.0:8000 --workers 3 config.wsgi:application"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      DJANGO_DATABASE_URL: postgresql://vulcan:vulcan@postgres:5432/vulcan
    depends_on:
      backend:
        condition: service_started
    command: celery -A config worker -l INFO -Q file_inspection,validation,standardisation,analytics,reports
    working_dir: /app/backend

  stream-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      DJANGO_DATABASE_URL: postgresql://vulcan:vulcan@postgres:5432/vulcan
      STREAM_INGESTION_ENABLED: ${STREAM_INGESTION_ENABLED:-true}
      TELEMETRY_HOT_STORAGE_ENABLED: ${TELEMETRY_HOT_STORAGE_ENABLED:-true}
      TELEMETRY_ARCHIVE_ENABLED: ${TELEMETRY_ARCHIVE_ENABLED:-true}
      TELEMETRY_ALLOW_SIMULATED_INPUTS: ${TELEMETRY_ALLOW_SIMULATED_INPUTS:-true}
      TELEMETRY_STORAGE_BACKEND: filesystem
      TELEMETRY_STORAGE_ROOT: /app/.data/telemetry
      TELEMETRY_BUFFER_DIR: /app/.data/telemetry-buffer
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: vulcan_ingest
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-vulcan-local-secret}
    depends_on:
      backend:
        condition: service_started
      clickhouse:
        condition: service_healthy
    volumes:
      - ./.data:/app/.data
    command: sh -c "python manage.py init_clickhouse && python manage.py poll_data_streams"
    working_dir: /app/backend

  ml-observer:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      DJANGO_DATABASE_URL: postgresql://vulcan:vulcan@postgres:5432/vulcan
      ML_MODEL_DIR: /app/models
    volumes:
      - ./models:/app/models:ro
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    command: python manage.py observe_machines
    working_dir: /app/backend

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_URL: http://backend:8000
        VULCAN_VARIANT: mushroom
    environment:
      BACKEND_URL: http://backend:8000
      VULCAN_VARIANT: mushroom
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
  minio-data:
  clickhouse-data:
