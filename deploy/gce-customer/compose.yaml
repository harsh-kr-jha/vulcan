# Tamaso customer GCE deployment — Docker Compose with Cloud SQL PostgreSQL.
#
# Images are referenced by full digest-pinned paths set in .env:
#   BACKEND_IMAGE=us-central1-docker.pkg.dev/project/repo/mfg-da-auto-all-backend@sha256:...
#   FRONTEND_IMAGE=us-central1-docker.pkg.dev/project/repo/mfg-da-auto-all-frontend@sha256:...

name: tamaso-${CUSTOMER_ID}

services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-tools:
    image: postgres:17-alpine
    profiles: ["tools"]
    user: root
    env_file: ${TAMASO_ENV_FILE:-.env}
    volumes:
      - /var/lib/tamaso/${CUSTOMER_ID}/backups:/backups

  data-init:
    image: busybox:1.37.0
    command:
      - sh
      - -c
      - >-
        chown -R 10001:10001 /data /backups /static /models &&
        chmod 700 /data /backups /models &&
        chmod 755 /static
    restart: "no"
    volumes:
      - /var/lib/tamaso/${CUSTOMER_ID}/data:/data
      - /var/lib/tamaso/${CUSTOMER_ID}/backups:/backups
      - /var/lib/tamaso/${CUSTOMER_ID}/static:/static
      - /var/lib/tamaso/${CUSTOMER_ID}/models:/models

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    env_file: ${TAMASO_ENV_FILE:-.env}
    environment:
      DJANGO_DATABASE_URL: ${DJANGO_DATABASE_URL:?Cloud SQL PostgreSQL URL is required}
      ML_MODEL_SOURCE: ${ML_MODEL_SOURCE:-local}
      ML_MODEL_DIR: /models
      ML_MODEL_BUCKET: ${ML_MODEL_BUCKET:-}
      ML_MODEL_PREFIX: ${ML_MODEL_PREFIX:-models}
      ML_MODEL_ENDPOINT_URL: ${ML_MODEL_ENDPOINT_URL:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DJANGO_CACHE_URL: ${DJANGO_CACHE_URL:-redis://redis:6379/1}
      DJANGO_STATIC_ROOT: /static
      VULCAN_ADMIN_ENABLED: "true"
      WORKSPACE_CACHE_TTL_SECONDS: "300"
    command:
      - gunicorn
      - --chdir
      - backend
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "1"
      - --threads
      - "2"
      - --timeout
      - "90"
      - --max-requests
      - "500"
      - --max-requests-jitter
      - "50"
      - config.wsgi:application
    depends_on:
      data-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - /var/lib/tamaso/${CUSTOMER_ID}/data:/data
      # The backend writes only validated admin uploads. The inference observer
      # mounts the same registry read-only below.
      - /var/lib/tamaso/${CUSTOMER_ID}/models:/models
      - /var/lib/tamaso/${CUSTOMER_ID}/backups:/backups
      - /var/lib/tamaso/${CUSTOMER_ID}/static:/static
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          r=urllib.request.Request('http://127.0.0.1:8000/health/',
          headers={'Host':'${APP_HOST}','X-Forwarded-Proto':'https'});
          urllib.request.urlopen(r, timeout=5)
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 60s
    stop_grace_period: 30s
    mem_limit: 640m
    mem_reservation: 192m
    memswap_limit: 1536m

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      NODE_OPTIONS: --max-old-space-size=256
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    mem_limit: 320m
    mem_reservation: 128m

  stream-worker:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    env_file: ${TAMASO_ENV_FILE:-.env}
    environment:
      DJANGO_DATABASE_URL: ${DJANGO_DATABASE_URL:?Cloud SQL PostgreSQL URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: ["python", "backend/manage.py", "poll_data_streams"]
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - /var/lib/tamaso/${CUSTOMER_ID}/data:/data
    mem_limit: 192m
    mem_reservation: 64m

  ml-observer:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    env_file: ${TAMASO_ENV_FILE:-.env}
    environment:
      DJANGO_DATABASE_URL: ${DJANGO_DATABASE_URL:?Cloud SQL PostgreSQL URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_TASK_ALWAYS_EAGER: "false"
      ML_MODEL_SOURCE: ${ML_MODEL_SOURCE:-local}
      ML_MODEL_DIR: /models
      ML_MODEL_BUCKET: ${ML_MODEL_BUCKET:-}
      ML_MODEL_PREFIX: ${ML_MODEL_PREFIX:-models}
      ML_MODEL_ENDPOINT_URL: ${ML_MODEL_ENDPOINT_URL:-}
    command: ["python", "backend/manage.py", "observe_machines"]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/lib/tamaso/${CUSTOMER_ID}/models:/models:ro
    mem_limit: 384m

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      APP_HOST: ${APP_HOST}
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/tamaso/${CUSTOMER_ID}/static:/srv/static:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 96m

volumes:
  caddy-data:
  caddy-config:
  redis-data:
