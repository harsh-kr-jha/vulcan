name: vulcan-${VULCAN_VARIANT}

services:
  data-init:
    image: busybox:1.37.0
    command:
      - sh
      - -c
      - >-
        chown -R 10001:10001 /data /backups /static &&
        chmod 700 /data /backups &&
        chmod 755 /static
    restart: "no"
    volumes:
      - /var/lib/vulcan/${VULCAN_VARIANT}/data:/data
      - /var/lib/vulcan/${VULCAN_VARIANT}/backups:/backups
      - /var/lib/vulcan/${VULCAN_VARIANT}/static:/static

  backend:
    image: ${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/backend-${VULCAN_VARIANT}:${IMAGE_TAG}
    restart: unless-stopped
    env_file: ${VULCAN_ENV_FILE:-.env}
    environment:
      DJANGO_DATABASE_URL: sqlite:////data/vulcan.sqlite3
      DJANGO_STATIC_ROOT: /static
      VULCAN_ADMIN_ENABLED: "true"
      VULCAN_SINGLE_NODE: "true"
      VULCAN_VARIANT: ${VULCAN_VARIANT}
      WORKSPACE_CACHE_TTL_SECONDS: "300"
    command:
      - gunicorn
      - --chdir
      - backend
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "1"
      - --threads
      - "2"
      - --timeout
      - "90"
      - --max-requests
      - "500"
      - --max-requests-jitter
      - "50"
      - config.wsgi:application
    depends_on:
      data-init:
        condition: service_completed_successfully
    expose:
      - "8000"
    volumes:
      - /var/lib/vulcan/${VULCAN_VARIANT}/data:/data
      - /var/lib/vulcan/${VULCAN_VARIANT}/backups:/backups
      - /var/lib/vulcan/${VULCAN_VARIANT}/static:/static
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          r=urllib.request.Request('http://127.0.0.1:8000/health/',
          headers={'Host':'${APP_HOST}','X-Forwarded-Proto':'https'});
          urllib.request.urlopen(r, timeout=5)
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 60s
    stop_grace_period: 30s
    mem_limit: 640m
    mem_reservation: 192m
    memswap_limit: 1536m

  frontend:
    image: ${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/frontend-${VULCAN_VARIANT}:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      NODE_OPTIONS: --max-old-space-size=256
      VULCAN_VARIANT: ${VULCAN_VARIANT}
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    mem_limit: 320m
    mem_reservation: 128m

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      APP_HOST: ${APP_HOST}
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/vulcan/${VULCAN_VARIANT}/static:/srv/static:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 96m

volumes:
  caddy-data:
  caddy-config:
