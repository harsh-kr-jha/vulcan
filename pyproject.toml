[project]
name = "vulcan-factory-intelligence"
version = "0.1.0"
description = "Multi-tenant factory operations intelligence platform"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=25.1,<26",
  "boto3>=1.39,<2",
  "celery>=5.5,<6",
  "dj-database-url>=3.0,<4",
  "django>=5.2,<5.3",
  "django-cors-headers>=4.7,<5",
  "djangorestframework>=3.16,<4",
  "duckdb>=1.3,<3",
  "gunicorn>=23,<24",
  "openpyxl>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "redis>=6.2,<7",
]

[dependency-groups]
dev = [
  "pip-audit>=2.10.1,<3",
  "pytest>=9.0.3,<10",
  "pytest-django>=4.11,<5",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
pythonpath = ["backend", "."]
testpaths = ["backend/tests", "processing/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["backend/apps/*/migrations", "test-data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ"]
ignore = ["DJ001"]
